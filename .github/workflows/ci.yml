name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: v1/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit --pretty false

      - name: Build
        run: npm run build

  agent-studio:
    name: Agent Studio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Test
        run: uv run pytest

  containers:
    name: Container Builds
    runs-on: ubuntu-latest
    needs:
      - frontend
      - agent-studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Sagad Console image
        uses: docker/build-push-action@v6
        with:
          context: ./v1
          push: false
          tags: sagad-console:ci

      - name: Build Agent Studio image
        uses: docker/build-push-action@v6
        with:
          context: ./agent-studio
          push: false
          tags: agent-studio:ci
