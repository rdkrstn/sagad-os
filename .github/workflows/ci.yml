name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: v1/package-lock.json

      - name: Install frontend dependencies
        working-directory: v1
        run: npm ci

      - name: Frontend dependency audit
        working-directory: v1
        run: npm audit --omit=dev --audit-level=high

      - name: Frontend lint
        working-directory: v1
        run: npm run lint

      - name: Frontend typecheck
        working-directory: v1
        run: npx tsc --noEmit --pretty false

      - name: Frontend build
        working-directory: v1
        run: npm run build

  containers:
    name: Container Builds
    runs-on: ubuntu-latest
    needs:
      - lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Sagad Console image
        uses: docker/build-push-action@v6
        with:
          context: ./v1
          push: false
          load: true
          tags: sagad-console:ci

      - name: Scan Sagad Console image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sagad-console:ci
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Free disk before Agent Studio build
        run: |
          docker image rm sagad-console:ci || true
          docker builder prune -af || true
          docker system prune -af --volumes || true
          df -h /

      - name: Build Agent Studio image
        uses: docker/build-push-action@v6
        with:
          context: ./agent-studio
          push: false
          load: true
          tags: agent-studio:ci

      - name: Scan Agent Studio image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agent-studio:ci
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"

  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    needs:
      - lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OCR runtime (poppler + tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: agent-studio/uv.lock

      - name: Install Agent Studio deps
        working-directory: agent-studio
        run: uv sync --frozen

      - name: Run pytest
        working-directory: agent-studio
        env:
          # Credential-free: tests use the in-memory store + dry-run model + deterministic
          # embeddings. DATABASE_URL="" overrides any local .env so no Postgres is required.
          DATABASE_URL: ""
          LLM_MODE: dry_run
          # Poller is off in CI; the poller roundtrip is pytest-covered with stubbed httpx
          # (tests/test_ghl_poller.py). Keep it explicit so a stray local .env can't flip it on.
          GHL_POLL_ENABLED: "false"
        run: uv run python -m pytest -q

  compose-smoke:
    name: Docker Compose Smoke
    runs-on: ubuntu-latest
    needs:
      - containers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: Boot preview stack and verify Agent Studio health
        env:
          SAGAD_POSTGRES_PASSWORD: sagad_ci_smoke
          SAGAD_WS_PUBLIC_URL: http://localhost:3000
          SAGAD_REALTIME_SECRET: ci-smoke-realtime-secret
          AUTH_URL: http://localhost:3000
          AUTH_SECRET: ci-smoke-auth-secret-must-be-at-least-32-chars
          EMAIL_SERVER: smtp://localhost:1025
          EMAIL_FROM: smoke@sagad-os.local
          AGENT_STUDIO_INTERNAL_SECRET: ci-smoke-internal-secret
          SAGAD_INTEGRATION_ENCRYPTION_KEY: ci-smoke-fernet-key-must-be-32-bytes
        run: |
          set -euo pipefail

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "=== compose-smoke FAILURE — diagnostics ===" >&2
              docker compose -f compose.vps.example.yaml ps --format json >&2 || true
              docker inspect sagad-agent-studio \
                --format '{{.State.Health.Status}} {{json .State.Health.Log}}' >&2 || true
              docker compose -f compose.vps.example.yaml logs --no-color --tail=120 sagad-db agent-studio sagad-console >&2 || true
            fi
            docker network rm client_internal_network || true
            docker compose -f compose.vps.example.yaml down -v --remove-orphans || true
            exit "$status"
          }
          trap cleanup EXIT

          # Idempotent: a stale network from a previous step must not fail the job.
          docker network create client_internal_network || true

          docker compose -f compose.vps.example.yaml config --quiet
          # Build first, drop build cache, then boot — building both large images
          # and keeping the cache around overflows the runner disk.
          docker compose -f compose.vps.example.yaml build
          docker builder prune -af
          docker compose -f compose.vps.example.yaml up -d --wait --wait-timeout 240

          # Fast-fail health poll: surface the failing healthcheck log line BEFORE the
          # curls, so an unhealthy container says *why* instead of just "connection refused".
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8010/health/ready >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker inspect sagad-agent-studio \
            --format 'health={{.State.Health.Status}}' || true

          curl --fail --show-error --silent http://127.0.0.1:8010/health
          curl --fail --show-error --silent http://127.0.0.1:8010/health/live
          curl --fail --show-error --silent http://127.0.0.1:8010/health/ready
          docker compose -f compose.vps.example.yaml exec -T sagad-console node -e "fetch('http://agent-studio:8010/health/live').then(r => { if (!r.ok) process.exit(1); return r.text(); }).then(console.log)"

  dev-e2e:
    name: Dev E2E Roundtrip (dry_run)
    runs-on: ubuntu-latest
    needs:
      - backend-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: agent-studio/uv.lock

      - name: Boot compose + run scripts/dev-e2e.sh
        env:
          # scripts/dev-e2e.sh sets its own credential-free defaults + LLM_MODE=dry_run.
          SAGAD_POSTGRES_PASSWORD: sagad_dev_e2e
          AGENT_STUDIO_INTERNAL_SECRET: dev-e2e-internal-secret
          SAGAD_INTEGRATION_ENCRYPTION_KEY: dev-e2e-fernet-key-must-be-32-bytes
          SAGAD_REALTIME_SECRET: dev-e2e-realtime-secret
          AUTH_SECRET: dev-e2e-auth-secret-must-be-at-least-32-chars
          AUTH_URL: http://localhost:3000
          SAGAD_WS_PUBLIC_URL: http://localhost:3000
          EMAIL_SERVER: smtp://localhost:1025
          EMAIL_FROM: dev-e2e@sagad-os.local
        run: bash scripts/dev-e2e.sh