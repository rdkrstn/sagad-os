name: Release Check

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(cat VERSION | tr -d '[:space:]')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "VERSION ($version) does not match tag ($tag)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Confirm changelog entry
        shell: bash
        run: |
          grep -q "## ${{ steps.version.outputs.version }}" CHANGELOG.md
