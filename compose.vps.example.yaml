name: sagad-os

services:
  sagad-db:
    image: pgvector/pgvector:pg16
    container_name: sagad-db
    environment:
      POSTGRES_DB: ${SAGAD_POSTGRES_DB:-sagad_os}
      POSTGRES_USER: ${SAGAD_POSTGRES_USER:-sagad}
      POSTGRES_PASSWORD: ${SAGAD_POSTGRES_PASSWORD:?Set SAGAD_POSTGRES_PASSWORD in .env}
    volumes:
      - sagad-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SAGAD_POSTGRES_USER:-sagad} -d ${SAGAD_POSTGRES_DB:-sagad_os}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"
    networks:
      - client_internal_network
    restart: unless-stopped

  sagad-console:
    build:
      context: ./v1
    container_name: sagad-console
    environment:
      SAGAD_API_BASE_URL: http://sagad-agent-studio:8010
      SAGAD_WS_PUBLIC_URL: ${SAGAD_WS_PUBLIC_URL:?Set SAGAD_WS_PUBLIC_URL in .env}
      SAGAD_REALTIME_SECRET: ${SAGAD_REALTIME_SECRET:?Set SAGAD_REALTIME_SECRET in .env}
      DATABASE_URL: postgresql://${SAGAD_POSTGRES_USER:-sagad}:${SAGAD_POSTGRES_PASSWORD}@sagad-db:5432/${SAGAD_POSTGRES_DB:-sagad_os}
      AUTH_URL: ${AUTH_URL:?Set AUTH_URL in .env}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      EMAIL_SERVER: ${EMAIL_SERVER:?Set EMAIL_SERVER in .env}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM in .env}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AGENT_STUDIO_INTERNAL_SECRET: ${AGENT_STUDIO_INTERNAL_SECRET:?Set AGENT_STUDIO_INTERNAL_SECRET in .env}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-preview}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      NEXT_TELEMETRY_DISABLED: "1"
    expose:
      - "3000"
    depends_on:
      sagad-db:
        condition: service_healthy
      agent-studio:
        condition: service_healthy
    networks:
      - client_internal_network
    restart: unless-stopped

  agent-studio:
    build:
      context: ./agent-studio
    container_name: sagad-agent-studio
    environment:
      DATABASE_URL: postgresql://${SAGAD_POSTGRES_USER:-sagad}:${SAGAD_POSTGRES_PASSWORD}@sagad-db:5432/${SAGAD_POSTGRES_DB:-sagad_os}
      AGENT_STUDIO_INTERNAL_SECRET: ${AGENT_STUDIO_INTERNAL_SECRET:?Set AGENT_STUDIO_INTERNAL_SECRET in .env}
      SAGAD_INTEGRATION_ENCRYPTION_KEY: ${SAGAD_INTEGRATION_ENCRYPTION_KEY:?Set SAGAD_INTEGRATION_ENCRYPTION_KEY in .env}
      SAGAD_REALTIME_SECRET: ${SAGAD_REALTIME_SECRET:?Set SAGAD_REALTIME_SECRET in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      # Also covers any OpenAI-compatible endpoint via OPENAI_BASE_URL (e.g. DeepSeek:
      # OPENAI_BASE_URL=https://api.deepseek.com/v1 + OPENAI_MODEL=deepseek-chat).
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      SAGAD_OCR_ENABLED: ${SAGAD_OCR_ENABLED:-true}
      SAGAD_OCR_LANG: ${SAGAD_OCR_LANG:-eng}
      SAGAD_OCR_MAX_PAGES: ${SAGAD_OCR_MAX_PAGES:-10}
      SAGAD_OCR_TIMEOUT_SECONDS: ${SAGAD_OCR_TIMEOUT_SECONDS:-30}
      LITELLM_ENABLED: ${LITELLM_ENABLED:-false}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://sagad-litellm:4000/v1}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # LLM_MODE=dry_run runs the graph with a deterministic stub model (no credentials, no GPU)
      # so the compose e2e roundtrip is reproducible in CI. Empty = use the real LiteLLM/OpenAI stack.
      LLM_MODE: ${LLM_MODE:-}
      # Model-provider stack (agent_studio.model_config). .dockerignore excludes .env, so these
      # must be passed explicitly or the container defaults to MODEL_PROVIDER=none -> DryRunChatModel
      # (every draft becomes the canned "This is the finalized draft reply from the supervisor.").
      # Set MODEL_PROVIDER to one of: openrouter / openai / fireworks / ollama_cloud / litellm.
      # OpenRouter is the recommended default (one key, many models); it has no embeddings endpoint,
      # so pair it with EMBEDDING_PROVIDER=fireworks|openai. DeepSeek is reached via the openai
      # provider: OPENAI_BASE_URL=https://api.deepseek.com/v1 + OPENAI_MODEL=deepseek-chat. Ollama is
      # the self-hosted/local option; only then set OLLAMA_CLOUD_BASE_URL=http://host.docker.internal:11434/v1
      # (see extra_hosts below) for a host-local Ollama, or the remote URL directly.
      MODEL_PROVIDER: ${MODEL_PROVIDER:-none}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-auto}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      FIREWORKS_BASE_URL: ${FIREWORKS_BASE_URL:-https://api.fireworks.ai/inference/v1}
      FIREWORKS_MODEL: ${FIREWORKS_MODEL:-}
      FIREWORKS_EMBEDDING_MODEL: ${FIREWORKS_EMBEDDING_MODEL:-nomic-embed-v1}
      OLLAMA_CLOUD_API_KEY: ${OLLAMA_CLOUD_API_KEY:-}
      OLLAMA_CLOUD_BASE_URL: ${OLLAMA_CLOUD_BASE_URL:-}
      OLLAMA_CLOUD_MODEL: ${OLLAMA_CLOUD_MODEL:-llama3.1}
      OLLAMA_CLOUD_EMBEDDING_MODEL: ${OLLAMA_CLOUD_EMBEDDING_MODEL:-nomic-embed-text}
      # Per-node model overrides (fall back to the active provider's model when unset).
      CLASSIFIER_MODEL: ${CLASSIFIER_MODEL:-}
      EXTRACTOR_MODEL: ${EXTRACTOR_MODEL:-}
      SUPERVISOR_MODEL: ${SUPERVISOR_MODEL:-}
      RERANK_ENABLED: ${RERANK_ENABLED:-false}
      RERANK_MODEL: ${RERANK_MODEL:-cohere/rerank-english-v3.0}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      # Webhook debouncing (opt-in). When enabled, the universal/GHL handlers return 202 and
      # coalesce a burst of messages into a single graph run after the debounce window.
      WEBHOOK_DEBOUNCE_ENABLED: ${WEBHOOK_DEBOUNCE_ENABLED:-false}
      WEBHOOK_DEBOUNCE_MS: ${WEBHOOK_DEBOUNCE_MS:-2500}
      # RevOps tiered auto-send "safe lane". Empty REVOPS_AUTOSEND_INTENTS falls through to the
      # code default (["pricing_lead"]), so a low-risk pricing reply auto-sends out of the box
      # once risk==low, retrieval_confidence >= REVOPS_AUTOSEND_CONFIDENCE (default 0.88), not
      # blocked, and the draft is non-empty. Set REVOPS_AUTOSEND_INTENTS to override (comma-list
      # of classifier intents; note pricing_faq/business_hours/status_check are NOT classifier
      # outputs -- use pricing_lead / general_support / booking_or_support / refund_or_cancellation).
      # Auto-send also requires retrieval_confidence >= the threshold (quality_score is capped at
      # min(0.88, retrieval_confidence)); if it still doesn't fire, enable RERANK_ENABLED or lower
      # REVOPS_AUTOSEND_CONFIDENCE.
      REVOPS_AUTOSEND_ENABLED: ${REVOPS_AUTOSEND_ENABLED:-true}
      REVOPS_AUTOSEND_INTENTS: ${REVOPS_AUTOSEND_INTENTS:-}
      REVOPS_AUTOSEND_CONFIDENCE: ${REVOPS_AUTOSEND_CONFIDENCE:-0.88}
      # GHL inbound poller (Private Integration Token -> Conversations API). Off by default; the
      # poller feeds the SAME _run_universal_inbound pipeline as /webhooks/ghl (no parallel graph
      # path) and skips silently when GHL is unconfigured or the DB is not ready. Enable to poll
      # GHL without the native Marketplace InboundMessage webhook. Watermarks persist in
      # integration_sync_state (per-conversation lastMessageId cursor in payload).
      GHL_POLL_ENABLED: ${GHL_POLL_ENABLED:-false}
      CHATWOOT_BASE_URL: ${CHATWOOT_BASE_URL:-}
      CHATWOOT_ACCOUNT_ID: ${CHATWOOT_ACCOUNT_ID:-}
      CHATWOOT_API_ACCESS_TOKEN: ${CHATWOOT_API_ACCESS_TOKEN:-}
      CHATWOOT_WEBHOOK_TOKEN: ${CHATWOOT_WEBHOOK_TOKEN:-}
      TWENTY_ENABLED: ${TWENTY_ENABLED:-false}
      TWENTY_BASE_URL: ${TWENTY_BASE_URL:-}
      TWENTY_API_KEY: ${TWENTY_API_KEY:-}
      TWENTY_API_MODE: ${TWENTY_API_MODE:-graphql}
      TWENTY_DRY_RUN: ${TWENTY_DRY_RUN:-true}
      TWENTY_ALLOW_WRITES: ${TWENTY_ALLOW_WRITES:-false}
      TWENTY_TIMEOUT_SECONDS: ${TWENTY_TIMEOUT_SECONDS:-20}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-sagad-agent-studio-vps}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-preview}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    expose:
      - "8010"
    # Only relevant for the ollama_cloud provider pointing at a host-local Ollama: lets the
    # container reach http://host.docker.internal:11434 (Docker Desktop maps this automatically;
    # on Linux this adds the host-gateway alias). No-op for OpenRouter/OpenAI/Fireworks/DeepSeek
    # (remote endpoints) and for a remote Ollama.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      sagad-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8010/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - client_internal_network
    ports:
      - "8010:8010"
    restart: unless-stopped

  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    container_name: sagad-litellm
    profiles:
      - litellm
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - ./infra/litellm/config.example.yaml:/app/config.yaml:ro
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5).read()\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - client_internal_network
    restart: unless-stopped

networks:
  client_internal_network:
    external: true

volumes:
  sagad-db-data:
