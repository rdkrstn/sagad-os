services:
  sagad-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sagad_os
      POSTGRES_USER: sagad
      POSTGRES_PASSWORD: sagad_dev_password
    ports:
      - "5433:5432"
    volumes:
      - sagad-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sagad -d sagad_os"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  sagad-console:
    build:
      context: ./v1
    environment:
      SAGAD_API_BASE_URL: http://agent-studio:8010
      SAGAD_WS_PUBLIC_URL: ws://localhost:8010/ws/conversations
      SAGAD_REALTIME_SECRET: sagad-preview-realtime-secret-change-me
      DATABASE_URL: postgresql://sagad:sagad_dev_password@sagad-db:5432/sagad_os
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: sagad-preview-auth-secret-change-me
      EMAIL_SERVER: smtp://localhost:1025
      EMAIL_FROM: Sagad OS <noreply@sagad.local>
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AGENT_STUDIO_INTERNAL_SECRET: sagad-preview-internal-secret-change-me
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-preview}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    depends_on:
      sagad-db:
        condition: service_healthy
      agent-studio:
        condition: service_healthy
    restart: unless-stopped

  agent-studio:
    build:
      context: ./agent-studio
    env_file:
      - ./agent-studio/.env.example
    environment:
      DATABASE_URL: postgresql://sagad:sagad_dev_password@sagad-db:5432/sagad_os
      AGENT_STUDIO_INTERNAL_SECRET: sagad-preview-internal-secret-change-me
      SAGAD_INTEGRATION_ENCRYPTION_KEY: sagad-preview-integration-encryption-key-change-me
      SAGAD_REALTIME_SECRET: sagad-preview-realtime-secret-change-me
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      SAGAD_OCR_ENABLED: ${SAGAD_OCR_ENABLED:-true}
      SAGAD_OCR_LANG: ${SAGAD_OCR_LANG:-eng}
      SAGAD_OCR_MAX_PAGES: ${SAGAD_OCR_MAX_PAGES:-10}
      SAGAD_OCR_TIMEOUT_SECONDS: ${SAGAD_OCR_TIMEOUT_SECONDS:-30}
      LITELLM_ENABLED: ${LITELLM_ENABLED:-false}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000/v1}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-preview}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    ports:
      - "8010:8010"
    depends_on:
      sagad-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health/live', timeout=5).read()\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    profiles:
      - litellm
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sagad-preview-litellm-key-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - ./infra/litellm/config.example.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5).read()\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  sagad-db-data:
