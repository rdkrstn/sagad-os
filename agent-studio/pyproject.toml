[project]
name = "agent-studio"
version = "0.1.0"
description = "Sagad Agent Studio dev backend for Chatwoot HITL preview."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  "docling>=2.102.2",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "langchain-core>=1.2.22,<2.0.0",
  "langchain-openai>=0.1.0",
  "langgraph>=0.2.0",
  "litellm>=1.88.0",
  "openpyxl>=3.1.5",
  "pdf2image>=1.17.0",
  "pillow>=11.0.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.8.0",
  "pypdf>=5.0.0",
  "pytesseract>=0.3.13",
  "python-docx>=1.1.2",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.3",
  "uvicorn[standard]>=0.30.0",
  "starlette>=1.3.1",
]

[dependency-groups]
dev = [
  "langgraph-cli[inmem]>=0.4.27",
  "pytest>=8.3.0",
  "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["agent_studio"]
