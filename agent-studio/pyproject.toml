[project]
name = "agent-studio"
version = "0.1.0"
description = "Sagad Agent Studio dev backend for Chatwoot HITL preview."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "langchain>=0.3.0,<0.4.0",
  "langgraph>=0.2.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
